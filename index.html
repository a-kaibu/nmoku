<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="勝つたびに自分だけ目標が4→5→6目と上がる五目並べ。CPUと対戦できます。"
    />
    <title>N目並べ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1><em>N</em>目並べ</h1>
        <p>勝つたびに自分だけ条件が厳しくなる五目並べ。6目で勝てば優勝。</p>
      </header>

      <div class="board-col">
        <div class="status">
          <div id="msg" role="status" aria-live="polite"></div>
          <div class="opts">
            <label for="level">CPUの強さ</label>
            <select id="level">
              <option value="easy">やさしい</option>
              <option value="normal" selected>ふつう</option>
              <option value="hard">つよい</option>
            </select>
          </div>
        </div>
        <div class="board-box">
          <canvas id="board" tabindex="0" aria-label="15×15の盤面。クリックで石を置きます"></canvas>
          <div class="overlay" id="overlay" hidden>
            <div class="card">
              <h2 id="ov-title"></h2>
              <p id="ov-text"></p>
              <button id="ov-btn" type="button"></button>
            </div>
          </div>
        </div>
      </div>

      <aside>
        <section class="panel">
          <h3>目標の目数</h3>
          <div class="player" id="p-human">
            <span class="stone-ico b"></span>
            <div>
              <div class="name">あなた</div>
              <div class="who">黒石</div>
            </div>
            <div class="bign"><span id="n-human">4</span><small>目</small></div>
            <div class="ladder" id="l-human"></div>
          </div>
          <div class="player" id="p-cpu">
            <span class="stone-ico w"></span>
            <div>
              <div class="name">CPU</div>
              <div class="who">白石</div>
            </div>
            <div class="bign"><span id="n-cpu">4</span><small>目</small></div>
            <div class="ladder" id="l-cpu"></div>
          </div>
        </section>

        <section class="panel">
          <h3>ラウンド履歴</h3>
          <ol class="log" id="log"></ol>
        </section>

        <section class="panel rules">
          <h3>ルール</h3>
          <ul>
            <li>
              15×15の盤に交互に石を置き、自分の目標数以上を縦・横・斜めに並べたらラウンド勝利。
            </li>
            <li>ラウンドに勝つと<b>自分の目標だけ</b>が1増える（4→5→6）。</li>
            <li>目標<b>6目</b>の状態でラウンドに勝てば優勝。</li>
            <li>負けた側が次のラウンドの先手。盤が埋まったら引き分けで目標はそのまま。</li>
          </ul>
        </section>

        <button class="ghost" id="reset" type="button">最初からやり直す</button>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
